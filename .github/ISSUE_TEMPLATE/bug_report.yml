name: Bug report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this
      placeholder: |
        1. Run /setup with...
        2. Click "Create session request"
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any console output. Remove tokens or other secrets first.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Bot version / commit
    validations:
      required: false
